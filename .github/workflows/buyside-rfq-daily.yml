name: Buyside RFQ — Daily

# Daily nitrile-glove sourcing pipeline:
#   - Sends initial RFQ + follow-ups (D+0 / D+3 / D+7 cadence) to supplier contacts
#   - AI-personalizes each email (Vercel AI Gateway → Haiku 4.5) using public
#     web research per recipient (Serper)
#   - Emails a summary report to jay.lin@usproglove.com after each cohort run
#
# A/B SEND-TIME TEST
#   Three schedules fire daily, each hitting one cohort:
#     11:00 UTC = 07:00 ET — cohort A  (EU late morning + Asia EOD)
#     14:00 UTC = 10:00 ET — cohort B  (US morning + EU late afternoon)
#     01:00 UTC = 21:00 ET — cohort C  (Asia next-morning)
#   The cron endpoint derives the cohort from the current UTC hour, so each
#   schedule sends only to its ~7-prospect slice.
#
# This replaces the QStash schedule for buyside-rfq; all other cron jobs
# (outbound, reply-poll, content-publish, usage-snapshot) remain on QStash.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APP_BASE_URL  — public https URL of the production deploy
#   CRON_SECRET   — same value set in Vercel env; used as Bearer auth

on:
  schedule:
    - cron: "0 11 * * *"  # cohort A
    - cron: "0 14 * * *"  # cohort B
    - cron: "0 1  * * *"  # cohort C
  workflow_dispatch:
    inputs:
      cohort:
        description: "Cohort (A / B / C / all). Default = derive from UTC hour."
        type: choice
        default: ""
        options:
          - ""
          - "A"
          - "B"
          - "C"
          - "all"
      dry_run:
        description: "Dry-run (no emails sent, no DB writes for messages)"
        type: boolean
        default: false

concurrency:
  group: buyside-rfq
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.APP_BASE_URL }}" ]; then
            echo "::error::APP_BASE_URL secret is not set"; exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET secret is not set"; exit 1
          fi

      - name: Trigger /api/cron/buyside-rfq
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail

          # Build the query string. Manual dispatch can override cohort; for
          # scheduled fires, the server derives the cohort from the UTC hour.
          QS_PARTS=()
          if [ "${DRY_RUN:-false}" = "true" ]; then
            QS_PARTS+=("dry=1")
            echo "::notice::Dry-run mode — no emails will be sent"
          fi
          if [ -n "${MANUAL_COHORT:-}" ]; then
            QS_PARTS+=("cohort=${MANUAL_COHORT}")
            echo "::notice::Manual cohort override: ${MANUAL_COHORT}"
          fi
          QS=""
          if [ ${#QS_PARTS[@]} -gt 0 ]; then
            QS="?$(IFS='&'; echo "${QS_PARTS[*]}")"
          fi

          URL="${APP_BASE_URL%/}/api/cron/buyside-rfq${QS}"
          echo "GET $URL  (UTC hour: $(date -u +%H))"

          # 60s connect + 5min total — the route has maxDuration=300.
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 330 --connect-timeout 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$URL")

          echo "HTTP $HTTP_CODE"
          cat response.json | head -c 4000
          echo ""

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cron endpoint returned non-200 ($HTTP_CODE)"
            exit 1
          fi

      - name: Upload response artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyside-response-${{ github.run_id }}
          path: response.json
          retention-days: 14
          if-no-files-found: ignore
